name: Sprite Pack Inventory

on:
  push:
    branches:
      - feat/stardew-foundation-4.7.2
    paths:
      - ".github/workflows/sprite-pack-inventory.yml"
      - "sprites/**"

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: List sprite pack contents
        shell: bash
        run: |
          unzip -l "sprites/Sprout Lands - Sprites - premium pack.zip" | tee sprite-pack-manifest.txt

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: sprite-pack-manifest
          path: sprite-pack-manifest.txt
