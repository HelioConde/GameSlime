name: GameSlime — Qualidade e GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gameslime-pages
  cancel-in-progress: false
jobs:
  qa:
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificacao de licenca e estrutura
        run: node --test tests/site.test.cjs && node --check app.js
      - name: Instalar navegador
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capturas automaticas e regressao
        run: node tests/visual-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameslime-visual-qa
          path: visual-qa/
          if-no-files-found: ignore
      - name: Verificar Pages antes de publicar
        if: github.event_name != 'pull_request'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type // "legacy"' 2>/dev/null || echo unavailable)"
          if [ "$mode" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages configurado para GitHub Actions: publicacao via workflow autorizada." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publicacao separada::Pages em modo $mode. O QA passou; use a branch gh-pages, ou altere Settings > Pages > GitHub Actions se quiser publicar pelo workflow."
            echo "QA aprovado. Pages em modo $mode: a branch gh-pages publica a versao estatica; o deploy do workflow foi ignorado intencionalmente." >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    if: github.event_name != 'pull_request' && needs.qa.outputs.pages_enabled == 'true'
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar somente arquivos seguros
        run: |
          mkdir -p dist-pages
          cp index.html styles.css app.js favicon.svg .nojekyll dist-pages/
          test "$(find dist-pages -type f | wc -l)" -eq 5
          ! find dist-pages -type f | grep -Ei '\\.(zip|php|sql|env)$'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
