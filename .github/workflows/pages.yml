name: GameSlime — Qualidade e GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gameslime-pages
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificacao de licenca e estrutura
        run: node --test tests/site.test.cjs && node --check app.js
      - name: Instalar navegador
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capturas automaticas e regressao
        run: node tests/visual-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameslime-visual-qa
          path: visual-qa/
          if-no-files-found: ignore

  pages-readiness:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Verificar configuracao existente do GitHub Pages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          code="$(curl --silent --show-error --output /tmp/pages-response.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages")"
          if [ "$code" = 200 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages ja esta habilitado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages nao habilitado::Abra Settings > Pages e selecione Source: GitHub Actions. A verificacao visual continua ativa; publicacao fica pendente."
            {
              echo "## Publicação pendente (HTTP ${code})"
              echo "Os testes podem passar, mas **este workflow não publicou o site**."
              echo "Ative Settings → Pages → Build and deployment → Source: GitHub Actions e execute novamente o workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: github.event_name != 'pull_request' && needs.pages-readiness.outputs.configured == 'true'
    needs: [qa, pages-readiness]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar somente arquivos seguros
        run: |
          mkdir -p dist-pages
          cp index.html styles.css app.js favicon.svg .nojekyll dist-pages/
          test "$(find dist-pages -type f | wc -l)" -eq 5
          ! find dist-pages -type f | grep -Ei '\.(zip|php|sql|env)$'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
