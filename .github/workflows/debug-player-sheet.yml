name: Debug Player Sheet

on:
  push:
    branches:
      - feat/stardew-foundation-4.7.2
    paths:
      - ".github/workflows/debug-player-sheet.yml"

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build annotated contact sheet
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw

          source = Image.open("assets/sprout_lands/characters/player_premium.png").convert("RGBA")
          frame_w = 48
          frame_h = 48
          columns = source.width // frame_w
          rows = source.height // frame_h
          scale = 2
          label_w = 90

          scaled = source.resize((source.width * scale, source.height * scale), Image.Resampling.NEAREST)
          canvas = Image.new("RGBA", (scaled.width + label_w, scaled.height), (28, 30, 33, 255))
          canvas.paste(scaled, (label_w, 0))
          draw = ImageDraw.Draw(canvas)

          for row in range(rows):
              y = row * frame_h * scale
              draw.text((8, y + 6), f"ROW {row:02d}", fill=(255, 255, 255, 255))
              draw.line((label_w, y, label_w + scaled.width, y), fill=(255, 215, 64, 200), width=1)

          for col in range(columns + 1):
              x = label_w + col * frame_w * scale
              draw.line((x, 0, x, scaled.height), fill=(255, 215, 64, 110), width=1)

          canvas.save("docs/player_premium_rows.png")

          actions = Image.open("assets/sprout_lands/characters/player_actions.png").convert("RGBA")
          a_frame_w = 16
          a_frame_h = 16
          a_cols = actions.width // a_frame_w
          a_rows = actions.height // a_frame_h
          a_scale = 4
          a_label_w = 90

          a_scaled = actions.resize((actions.width * a_scale, actions.height * a_scale), Image.Resampling.NEAREST)
          a_canvas = Image.new("RGBA", (a_scaled.width + a_label_w, a_scaled.height), (28, 30, 33, 255))
          a_canvas.paste(a_scaled, (a_label_w, 0))
          a_draw = ImageDraw.Draw(a_canvas)

          for row in range(a_rows):
              y = row * a_frame_h * a_scale
              a_draw.text((8, y + 4), f"ROW {row:02d}", fill=(255, 255, 255, 255))
              a_draw.line((a_label_w, y, a_label_w + a_scaled.width, y), fill=(255, 215, 64, 200), width=1)

          for col in range(a_cols + 1):
              x = a_label_w + col * a_frame_w * a_scale
              a_draw.line((x, 0, x, a_scaled.height), fill=(255, 215, 64, 110), width=1)

          a_canvas.save("docs/player_actions_rows.png")
          PY

      - name: Commit contact sheet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/player_premium_rows.png docs/player_actions_rows.png
          git commit -m "chore: add temporary player sprite map"
          git push
