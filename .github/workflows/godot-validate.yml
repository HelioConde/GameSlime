name: Godot 4.7.2 Validate

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: First import assets
        shell: bash
        run: |
          set -o pipefail
          # On a clean checkout Godot discovers/imports PNGs during this first
          # editor pass. Scripts that preload those PNGs may report transient
          # parse errors before the imports exist, so this pass is intentionally
          # permissive. The next pass is the real validation.
          godot --headless --editor --path . --quit 2>&1 | tee godot-first-import.log || true

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-editor.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed loading resource|Cannot get class" godot-editor.log; then
            exit 1
          fi

      - name: Smoke test main scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed loading resource|Invalid call|Invalid get index|Invalid set index" godot-runtime.log; then
            exit 1
          fi

      - name: Playability regression smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://tests/playability_smoke.tscn 2>&1 | tee godot-playability.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed loading resource|Invalid call|Invalid get index|Invalid set index|\[PLAYABILITY\] FAIL" godot-playability.log; then
            exit 1
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: |
            godot-first-import.log
            godot-editor.log
            godot-runtime.log
            godot-playability.log
